<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ingreso Ceibal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0d7a70; --teal-hover:#0a635b; --teal-soft:#d2e9e4; --teal-soft-hover:#c2e0da;
    --orange:#f58220; --ink:#141414; --muted:#6f7276; --border:#d9dcdd;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;
  }
  .page{position:relative;display:flex;min-height:max(100vh,660px)}

  /* ---------------- IZQUIERDA ---------------- */
  .left{
    width:34%;min-width:340px;display:flex;flex-direction:column;justify-content:center;
    align-items:center;padding:40px 34px;background:#fff;
  }
  .col{width:100%;max-width:330px;display:flex;flex-direction:column;align-items:center}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:34px}
  .brand svg{width:38px;height:38px;display:block}
  .brand span{font-size:30px;font-weight:800;letter-spacing:-.5px}
  h1{font-size:17px;font-weight:700;margin:0 0 46px}
  form{width:100%;display:flex;flex-direction:column;align-items:center}
  .field{width:100%}
  input{
    width:100%;height:52px;padding:0 16px;font:inherit;font-size:15px;border:1px solid var(--border);
    border-radius:6px;background:#fff;color:var(--ink);outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  input::placeholder{color:#8b8f93}
  input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,122,112,.12)}
  .btn{
    margin-top:34px;height:48px;padding:0 38px;border:0;border-radius:999px;background:var(--teal);
    color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;
    transition:background .15s,transform .06s;
  }
  .btn:hover{background:var(--teal-hover)}
  .btn:active{transform:scale(.98)}
  .btn[disabled]{opacity:.7;cursor:default}
  .or{margin:22px 0 14px;font-size:12.5px;color:var(--muted)}
  .alt{
    width:100%;height:42px;margin-bottom:11px;border:0;border-radius:999px;background:var(--teal-soft);
    color:#0b3d38;font:inherit;font-size:13.5px;font-weight:600;display:flex;align-items:center;
    justify-content:center;gap:9px;cursor:pointer;transition:background .15s;
  }
  .alt:hover{background:var(--teal-soft-hover)}
  .alt svg{width:16px;height:16px}
  .foot{margin:24px 0 0;font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center}
  .foot a{color:var(--muted)}
  .hidden{display:none!important}
  .demo-notice{width:100%;margin:-28px 0 25px;padding:11px 13px;border:1px solid #edc46b;
        border-radius:8px;background:#fff8e6;color:#684600;font-size:11px;line-height:1.5;text-align:center}
  .demo-notice strong{display:block;font-size:12px;margin-bottom:2px}
  .chip{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:12.5px;color:var(--muted);margin:12px 0;
  }
  .chip b{color:var(--ink);font-weight:600}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .feedback{width:100%;margin-top:26px;padding-top:18px;border-top:1px solid #e5e7e8}
  .feedback h2{font-size:14px;margin:0 0 6px;text-align:left}
  .feedback p{font-size:11px;line-height:1.5;color:var(--muted);margin:0 0 10px}
  .feedback textarea{width:100%;min-height:84px;resize:vertical;padding:10px 12px;font:inherit;font-size:13px;border:1px solid var(--border);border-radius:6px}
  .feedback textarea:focus{outline:2px solid rgba(13,122,112,.2);border-color:var(--teal)}
  .feedback button{margin-top:9px;padding:9px 16px;border:0;border-radius:999px;background:var(--teal);color:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .feedback button:disabled{opacity:.65;cursor:wait}
  .chip button{
    background:none;border:0;font:inherit;font-size:12px;color:var(--teal);
    cursor:pointer;text-decoration:underline;padding:0;
  }

  /* ---------------- DERECHA ---------------- */
  .right{
    flex:1;position:relative;background:#000;color:#fff;display:flex;flex-direction:column;
    padding:56px 40px 34px 56px;overflow:hidden;
  }
  .promo{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:600px}
  .huge{font-size:clamp(42px,5.2vw,74px);font-weight:800;line-height:.98;letter-spacing:-1.5px}
  .conf-line{display:flex;align-items:center;gap:16px;margin-top:14px}
  .conf-pill{
    background:var(--orange);color:#000;font-weight:800;font-size:clamp(20px,2.3vw,34px);
    padding:6px 26px;border-radius:999px;line-height:1.25;
  }
  .year{font-size:clamp(24px,2.6vw,38px);font-weight:600}
  .promo p{
    color:var(--orange);font-weight:700;font-size:clamp(17px,1.85vw,27px);
    line-height:1.3;margin:22px 0 26px;
  }
  .cta{
    align-self:flex-start;background:#fff;color:#000;font-weight:700;text-decoration:none;
    font-size:clamp(14px,1.4vw,20px);padding:9px 30px;border-radius:999px;
  }
  .logos{display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-top:28px}
  .lg{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:#fff;line-height:1.1}
  .lg svg{width:26px;height:26px;flex:none}
  .mic{
    position:absolute;right:34px;bottom:26px;width:clamp(120px,15vw,195px);aspect-ratio:1;
    border-radius:50%;background:var(--orange);display:grid;place-items:center;
  }
  .mic svg{width:44%;height:44%}
  .a11y{
    position:absolute;right:10px;bottom:8px;width:34px;height:34px;border-radius:50%;
    background:#fff;display:grid;place-items:center;z-index:3;
  }
  .toast{
    position:absolute;left:16px;bottom:16px;background:rgba(20,20,20,.88);color:#fff;font-size:12px;
    padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5;
  }
  .toast.on{opacity:1}

  @media(max-width:820px){
    .page{flex-direction:column}
    .left{width:100%;min-width:0;padding:44px 24px}
    .right{padding:44px 24px 150px}
  }
</style>
</head>
<body>

<div class="page">

  <!-- ============ PANEL IZQUIERDO ============ -->
  <section class="left">
    <div class="col">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="#0d7a70"/>
          <circle cx="26.5" cy="20" r="13" fill="#fff"/>
        </svg>
        <span>Ceibal</span>
      </div>

      <h1>Acceso</h1>
      

      <form id="form" novalidate>

        <!-- PASO 1: usuario ficticio para la demostración -->
        <div class="field" id="campoCedula">
          <input id="cedula" type="text" placeholder="Cedula/usuario"
                 autocomplete="off" spellcheck="false" maxlength="40" aria-label="Usuario ficticio">
        </div>

        <!-- chip para volver -->
        <div class="chip hidden" id="chip">
          <span>Cedula/usuario: <b id="chipValor"></b></span>
          <button type="button" id="volver">cambiar</button>
        </div>

        <!-- PASO 2: código ficticio; nunca es una contraseña real -->
        <div class="field hidden" id="campoPass">
          <input id="pass" type="text" placeholder="contraseña" autocomplete="off"
                 maxlength="12" aria-label="Código de demostración">
        </div>

        <button class="btn" id="btn" type="submit">Siguiente</button>

        <div class="or">opciones de acceso (solo visuales)</div>

        <button class="alt" type="button">
          <svg viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.5 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.1 5.3-4.5 6.9l7.6 5.9c4.4-4.1 6.6-10.1 6.6-17.2z"/>
            <path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.6 24c0-1.6.3-3.2.8-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.3 0-11.7-3.7-13.6-9.1l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          Google 
        </button>

        <button class="alt" type="button">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="#0b3d38" stroke-width="2"/>
            <path d="M8 9h8M8 13h8M12 9v8" stroke="#0b3d38" stroke-width="1.8" fill="none"/>
          </svg>
          DGEIP
        </button>

      </form>

      <section class="feedback" aria-labelledby="feedbackTitle">
        <form id="feedbackForm" action="https://formspree.io/f/xdkpodov" method="POST">
          <textarea id="feedbackMessage" name="comentario" maxlength="1000" required placeholder="Contá qué habría que mejorar..."></textarea>
          <input type="hidden" name="_subject" value="describe tu problema">
          <button id="feedbackButton" type="submit">Enviar comentario</button>
        </form>
      </section>
    </div>
  </section>

  <!-- ============ PANEL DERECHO ============ -->
  <section class="right">

    <div class="promo">
      <div class="huge">Demo</div>
      <div class="huge">EduIA</div>
      <div class="conf-line">
        <span class="conf-pill">CONF</span>
        <span class="year">2026</span>
      </div>
      <p>Congreso internacional sobre inteligencia artificial en la educación</p>
      <a class="cta" href="#" id="ctaInfo">Conocé más</a>
    </div>

    <div class="logos">
      <div class="lg">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#fff"/><circle cx="26.5" cy="20" r="13" fill="#000"/></svg>
        <span>Ceibal</span>
      </div>
      <div class="lg">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="20" cy="20" r="6.5" fill="#fff"/></svg>
        <span>Fundación<br>Ceibal</span>
      </div>
      <div class="lg">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="4" fill="#fff"/>
          <path d="M20 3v5M20 32v5M3 20h5M32 20h5M8 8l3.5 3.5M28.5 28.5L32 32M32 8l-3.5 3.5M11.5 28.5L8 32"
                stroke="#fff" stroke-width="2"/>
        </svg>
        <span>MERCOSUR</span>
      </div>
      <div class="lg">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M12 26l8-13 8 13z" fill="#fff"/></svg>
        <span>Ceibal<br>en casa</span>
      </div>
    </div>

    <div class="mic">
      <svg viewBox="0 0 24 24" fill="#141414">
        <path d="M12 14.5a3.75 3.75 0 0 0 3.75-3.75v-5a3.75 3.75 0 0 0-7.5 0v5A3.75 3.75 0 0 0 12 14.5z"/>
        <path d="M18.5 10.75a1 1 0 1 0-2 0 4.5 4.5 0 0 1-9 0 1 1 0 1 0-2 0 6.5 6.5 0 0 0 5.5 6.4v1.6H9.75a1 1 0 1 0 0 2h4.5a1 1 0 1 0 0-2H13v-1.6a6.5 6.5 0 0 0 5.5-6.4z"/>
      </svg>
    </div>

    <div class="a11y">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="12" fill="#fff"/>
        <circle cx="12" cy="7" r="2.2" fill="#3b82f6"/>
        <path d="M12 10.5c-2.4 0-4.4-.5-4.4-.5a1 1 0 0 0-.4 2s1.5.4 3.3.5v3.4l-1.2 3.2a1 1 0 0 0 1.9.7L12 17l1.8 2.8a1 1 0 0 0 1.9-.7l-1.2-3.2v-3.4c1.8-.1 3.3-.5 3.3-.5a1 1 0 0 0-.4-2s-2 .5-4.4.5z" fill="#f58220"/>
      </svg>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite">Demostración</div>
  </section>

</div>

<script>
(function () {
  'use strict';

  const form = document.getElementById('form');
  const campoUsuario = document.getElementById('campoCedula');
  const usuario = document.getElementById('cedula');
  const campoCodigo = document.getElementById('campoPass');
  const codigo = document.getElementById('pass');
  const boton = document.getElementById('btn');
  const chip = document.getElementById('chip');
  const chipValor = document.getElementById('chipValor');
  const volver = document.getElementById('volver');
  const toast = document.getElementById('toast');
  const enlacesSinDestino = [document.getElementById('ctaInfo'), ...document.querySelectorAll('.alt')];
  let paso = 1;
  let usuarioDemo = '';
  let avisoTimer;

  function aviso(mensaje) {
    toast.textContent = mensaje;
    toast.classList.add('on');
    clearTimeout(avisoTimer);
    avisoTimer = setTimeout(() => toast.classList.remove('on'), 3000);
  }

  function volverAlInicio() {
    paso = 1;
    usuarioDemo = '';
    usuario.value = '';
    codigo.value = '';
    chip.classList.add('hidden');
    campoCodigo.classList.add('hidden');
    campoUsuario.classList.remove('hidden');
    boton.textContent = 'Siguiente';
    boton.disabled = false;
    usuario.focus();
  }

  usuario.addEventListener('input', function () {
    usuario.setCustomValidity('');
  });

  form.addEventListener('submit', function (evento) {
    evento.preventDefault();

    if (paso === 1) {
      const valor = usuario.value.trim();
      if (valor.length < 3) {
        usuario.setCustomValidity('Escribí un usuario ficticio de al menos 3 caracteres.');
        usuario.reportValidity();
        usuario.focus();
        return;
      }

      usuario.setCustomValidity('');
      usuarioDemo = valor;
      chipValor.textContent = usuarioDemo;
      chip.classList.remove('hidden');
      campoUsuario.classList.add('hidden');
      campoCodigo.classList.remove('hidden');
      boton.textContent = 'Entrar';
      codigo.value = '';
      paso = 2;
      codigo.focus();
      return;
    }

    if (!codigo.value.trim()) {
      codigo.setCustomValidity('');
      codigo.reportValidity();
      codigo.focus();
      return;
    }

    codigo.setCustomValidity('');
    
    // Redirección al ingreso de Crea (Ceibal)
    aviso('Redirigiendo al ingreso de Crea...');
    setTimeout(() => {
      window.location.href = 'https://ingreso.ceibal.edu.uy/loginunico/username.xhtml?service=https%3A%2F%2Fceibalsso.schoology.com%2F%3F%26domain%3Dceibal.schoology.com%26timestamp%3D1792062655';
    }, 1200);
  });

  volver.addEventListener('click', volverAlInicio);

  const feedbackForm = document.getElementById('feedbackForm');
  const feedbackMessage = document.getElementById('feedbackMessage');
  const feedbackButton = document.getElementById('feedbackButton');

  feedbackForm.addEventListener('submit', async function (evento) {
    evento.preventDefault();
    if (!feedbackMessage.value.trim()) {
      feedbackMessage.setCustomValidity('Escribí un comentario antes de enviarlo.');
      feedbackMessage.reportValidity();
      return;
    }
    feedbackMessage.setCustomValidity('');
    feedbackButton.disabled = true;
    feedbackButton.textContent = 'Enviando...';
    try {
      const respuesta = await fetch(feedbackForm.action, {
        method: 'POST',
        body: new FormData(feedbackForm),
        headers: { 'Accept': 'application/json' }
      });
      if (!respuesta.ok) throw new Error('No se pudo enviar el comentario.');
      feedbackForm.reset();
      aviso('Comentario enviado. ¡Gracias!');
    } catch (error) {
      aviso('No se pudo enviar. Revisá la conexión e intentá de nuevo.');
    } finally {
      feedbackButton.disabled = false;
      feedbackButton.textContent = 'Enviar comentario';
    }
  });

  feedbackMessage.addEventListener('input', function () {
    feedbackMessage.setCustomValidity('');
  });

  enlacesSinDestino.forEach(function (elemento) {
    elemento.addEventListener('click', function (evento) {
      evento.preventDefault();
      aviso('Esta opción externa no está conectada en la demostración.');
    });
  });
})();
</script>

</body>
</html>
